services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accountant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-accountant}
    volumes:
      - accountant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accountant} -d ${POSTGRES_DB:-accountant}"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: "1gb"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-accountant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-accountant}
      ACCOUNTANT_ENV: production
      DATA_DIR: /app/data
      ACCOUNTANT_HOST: 0.0.0.0
      ACCOUNTANT_PORT: 8010
    ports:
      - "127.0.0.1:${ACCOUNTANT_PUBLIC_PORT:-8010}:8010"
    volumes:
      - accountant_data:/app/data
      - accountant_artifacts:/app/artifacts
    command: ["bash", "scripts/start_api.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=10)"]
      interval: 60s
      timeout: 45s
      retries: 3
      start_period: 120s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-accountant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-accountant}
      ACCOUNTANT_ENV: production
      DATA_DIR: /app/data
      ACCOUNTANT_AUTOMATION_INTERVAL_SECONDS: ${ACCOUNTANT_AUTOMATION_INTERVAL_SECONDS:-21600}
      ACCOUNTANT_IMPORT_WORKERS: ${ACCOUNTANT_IMPORT_WORKERS:-4}
      ACCOUNTANT_REFRESH_WORKERS: ${ACCOUNTANT_REFRESH_WORKERS:-4}
      ACCOUNTANT_SCORE_WORKERS: ${ACCOUNTANT_SCORE_WORKERS:-2}
    volumes:
      - accountant_data:/app/data
      - accountant_artifacts:/app/artifacts
    command: ["bash", "scripts/run_vps_scheduler.sh"]

  backup:
    image: postgres:16-bookworm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-accountant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-accountant}
      ACCOUNTANT_BACKUP_DIR: /backups
      ACCOUNTANT_BACKUP_RETENTION_DAYS: ${ACCOUNTANT_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - accountant_backups:/backups
      - ./scripts:/scripts:ro
    command:
      - bash
      - -lc
      - |
        mkdir -p /backups
        chown postgres:postgres /backups
        chmod 700 /backups
        while true; do
          gosu postgres bash /scripts/backup_postgres.sh
          sleep "${ACCOUNTANT_BACKUP_INTERVAL_SECONDS:-86400}"
        done

volumes:
  accountant_postgres:
  accountant_data:
  accountant_artifacts:
  accountant_backups:
