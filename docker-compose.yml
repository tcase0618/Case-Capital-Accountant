version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: accountant-postgres
    environment:
      POSTGRES_USER: accountant
      POSTGRES_PASSWORD: accountant
      POSTGRES_DB: accountant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accountant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
