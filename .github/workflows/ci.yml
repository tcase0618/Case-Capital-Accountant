name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accountant
          POSTGRES_USER: accountant
          POSTGRES_PASSWORD: accountant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accountant -d accountant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://accountant:accountant@127.0.0.1:5432/accountant
      ACCOUNTANT_ENV: test
      SEC_USER_AGENT: Case Capital CI ci@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.3"

      - name: Sync dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts alembic

      - name: Mypy
        run: uv run mypy src/accountant/api/auth.py src/accountant/config.py --ignore-missing-imports

      - name: Grading Mypy
        run: uv run mypy src/accountant/research/grading_engine.py src/accountant/research/grading_evidence.py --follow-imports=silent --ignore-missing-imports

      - name: Pytest
        run: uv run pytest

      - name: API deprecation regression
        run: uv run pytest tests/test_remediation_followup.py tests/test_api.py -W 'error::DeprecationWarning:accountant.api.app'

      - name: Alembic migration smoke check
        run: uv run alembic upgrade head

      - name: Migrated research tables and schema gate
        run: uv run python scripts/check_research_schema.py

      - name: Full Alembic schema drift gate
        run: uv run alembic check

      - name: Backup and isolated restore with PostgreSQL 16
        run: |
          mkdir -p "$RUNNER_TEMP/accountant-backups"
          export SOURCE_URL=postgresql://accountant:accountant@127.0.0.1:5432/accountant
          export SCRATCH_URL=postgresql://accountant:accountant@127.0.0.1:5432/accountant_restore_test_ci
          docker run --rm --network host postgres:16-bookworm psql "$SOURCE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO companies (id,cik,name) VALUES ('00000000-0000-0000-0000-000000000001','0000000001','CI snapshot fixture')"
          docker run --rm --network host postgres:16-bookworm psql "$SOURCE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE accountant_restore_test_ci'
          docker run --rm --network host -v "$PWD/scripts:/scripts:ro" -v "$RUNNER_TEMP/accountant-backups:/backups" -e DATABASE_URL="$SOURCE_URL" -e ACCOUNTANT_BACKUP_MIN_FREE_BYTES=0 postgres:16-bookworm bash /scripts/backup_postgres.sh
          docker run --rm --network host postgres:16-bookworm psql "$SOURCE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO companies (id,cik,name) VALUES ('00000000-0000-0000-0000-000000000002','0000000002','CI post-dump fixture')"
          docker run --rm --network host -v "$PWD/scripts:/scripts:ro" -v "$RUNNER_TEMP/accountant-backups:/backups" -e DATABASE_URL="$SOURCE_URL" -e ACCOUNTANT_RESTORE_TEST_URL="$SCRATCH_URL" postgres:16-bookworm bash -c 'dump=$(find /backups -name "*.dump" -type f -print -quit); test "$(stat -c %a "$dump")" = 600; bash /scripts/verify_backup_restore.sh "$dump"'

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: accountant
      POSTGRES_PASSWORD: ci_compose_validation
      POSTGRES_DB: accountant
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose file
        run: |
          cp .env.production.example .env.production
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production image
        run: docker build -t case-capital-accountant:ci .
